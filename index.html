<style>

*{
margin:0;
padding:0;
box-sizing:border-box;

display:flex;

.card{

width:430px;

background:rgba(0,0,0,.55);

padding:40px;

text-align:center;

box-shadow:0 0 40px rgba(166,80,255,.4);

}

.logo{

font-size:60px;

margin-bottom:10px;

}

h1{

font-size:48px;

margin-bottom:10px;

}

p{

opacity:.8;

margin-bottom:30px;

}

a{

display:block;

margin:15px 0;

padding:16px;

border-radius:14px;

background:#8d3cff;

color:white;

text-decoration:none;

font-size:20px;

font-weight:bold;

transition:.25s;

}

a:hover{

transform:scale(1.05);

background:#a950ff;

}

.footer{

margin-top:25px;

font-size:13px;

opacity:.6;

}

</style>
